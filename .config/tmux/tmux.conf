# fix colors
set -g default-terminal "screen-256color"
set -sg terminal-overrides ",*:RGB"

# remove the date
set -g status-right ""

# set color
set -g status-fg '#c48282' 
set -g status-bg '#141415'
set-window-option -g window-status-current-style fg='#E8B589' 

set -g window-status-format "#I:#W"
set -g window-status-current-format "#I:#W#[default]"

# set mouse
set -g mouse on

# start indexing at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# bindings to move between windows
bind -n M-C-h previous-window
bind -n M-C-l next-window

# bindings to move between panes
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# set vi-mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# open panes in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

