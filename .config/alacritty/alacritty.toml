[window]
dynamic_padding = true

[font]
size = 18.0

[font.normal]
family = "IosevkaTerm Nerd Font"

[colors.primary]
background = "#121212"
foreground = "#e0e0e0"

[colors.cursor]
text = "#141415"
cursor = "#cdcdcd"

[colors.selection]
text = "#e0e0e0"
background = "#323232"

[colors.normal]
black   = "#222222"
red     = "#b9a0a0"
green   = "#a0b9a0"
yellow  = "#b9b0a0"
blue    = "#a0a0b9"
magenta = "#b0a0b9"
cyan    = "#a0b0b0"
white   = "#b2b2b2"

[colors.bright]
black   = "#323232"
red     = "#b9a0a0"
green   = "#a0b9a0"
yellow  = "#b9b0a0"
blue    = "#a0a0b9"
magenta = "#b0a0b9"
cyan    = "#a0b0b0"
white   = "#d0d0d0"

[colors.search.matches]
foreground = "#121212"
background = "#f3be7c"

[colors.search.focused_match]
foreground = "#121212"
background = "#f3be7c"

[colors.hints.start]
foreground = "#121212"
background = "#f3be7c"

[colors.hints.end]
foreground = "#121212"
background = "#f3be7c"
